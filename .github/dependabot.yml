version: 2

# One deliberately infrequent PR covers the Android and CI foundation. Native
# submodules remain pinned through third_party/dependencies.lock.toml because
# their updates also require source/checksum/patch review.
multi-ecosystem-groups:
  foundation:
    schedule:
      interval: quarterly
    open-pull-requests-limit: 1
    commit-message:
      prefix: deps
    labels:
      - dependencies

updates:
  - package-ecosystem: github-actions
    directory: /
    patterns:
      - "*"
    multi-ecosystem-group: foundation
    cooldown:
      default-days: 14

  - package-ecosystem: gradle
    directory: /
    patterns:
      - "*"
    multi-ecosystem-group: foundation
    cooldown:
      default-days: 14
      semver-major-days: 30
      semver-minor-days: 14
      semver-patch-days: 7
