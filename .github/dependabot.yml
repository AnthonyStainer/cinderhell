version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: Europe/London
    labels:
      - dependencies
      - github-actions
    open-pull-requests-limit: 5

  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "07:15"
      timezone: Europe/London
    labels:
      - dependencies
      - android
    groups:
      android-kotlin:
        patterns:
          - "androidx.*"
          - "com.android.*"
          - "org.jetbrains.kotlin*"
    open-pull-requests-limit: 5

  - package-ecosystem: gitsubmodule
    directory: /
    schedule:
      interval: monthly
    labels:
      - dependencies
      - native
    open-pull-requests-limit: 3
