name: Android

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      run_device_tests:
        description: Run instrumentation on an attached arm64 device runner
        required: false
        default: false
        type: boolean

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          submodules: recursive

      - uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a # v5.5.0
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1

      - name: Install Android toolchain
        run: sdkmanager "platforms;android-37.0" "build-tools;36.0.0" "ndk;27.0.12077973" "cmake;3.31.6"

      - name: Fetch pinned runtime artifacts
        run: ./scripts/fetch-native-dependencies.sh

      - name: Apply Android native patch
        run: ./scripts/apply-native-patches.sh

      - name: Verify bootstrap invariants
        run: |
          ./scripts/verify-bootstrap.sh
          python3 -m unittest discover -s scripts/tests
          ./scripts/build-test-corpus.py
          (cd test-corpus/generated && sha256sum --check SHA256SUMS)

      - name: JVM tests, lint, and native Android builds
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug assembleRelease assemblePreview assembleDebugAndroidTest --stacktrace

      - name: Inspect APK contents
        run: |
          ./scripts/inspect-apk.sh app/build/outputs/apk/debug/app-debug.apk
          ./scripts/inspect-apk.sh app/build/outputs/apk/release/app-release-unsigned.apk
          ./scripts/inspect-apk.sh app/build/outputs/apk/preview/app-preview.apk

      - name: Verify preview signature
        run: '"$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose app/build/outputs/apk/preview/app-preview.apk'

      - name: Build corresponding-source archive
        run: ./scripts/package-corresponding-source.sh

      - name: Retain APKs, source, and diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cinderhell-android
          path: |
            app/build/outputs/apk/**/*.apk
            app/build/reports/**
            app/build/test-results/**
            build/release/**

  device-tests:
    if: github.event_name == 'workflow_dispatch' && inputs.run_device_tests
    runs-on: [self-hosted, linux, android-arm64]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          submodules: recursive

      - uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a # v5.5.0
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Fetch and verify dependencies
        run: |
          ./scripts/fetch-native-dependencies.sh
          ./scripts/apply-native-patches.sh
          ./scripts/verify-bootstrap.sh

      - name: Physical arm64 instrumentation
        run: ./scripts/run-device-tests.sh

      - name: Capture device matrix evidence
        if: always()
        run: |
          adb shell getprop > app/build/device-properties.txt
          adb shell dumpsys input > app/build/device-input.txt
          adb shell dumpsys display > app/build/device-display.txt
          adb logcat -d > app/build/device-logcat.txt

      - name: Retain instrumentation and device diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cinderhell-device-tests
          path: |
            app/build/reports/androidTests/**
            app/build/outputs/androidTest-results/**
            app/build/device-*.txt
